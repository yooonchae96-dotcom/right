<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>발표 대본 제출</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#F2F4F6; --card:#FFFFFF; --ink:#191F28; --sub:#6B7684; --dim:#8B95A1;
  --line:#E5E8EB; --blue:#3182F6; --blue-d:#1B64DA; --blue-l:#E8F3FF;
  --red:#F04452; --red-l:#FFEBEE; --green:#00B871; --green-l:#E5F9F1;
  --gray:#B0B8C1; --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:15px; line-height:1.6; letter-spacing:-0.01em;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;letter-spacing:-0.01em}
textarea{font-family:inherit;letter-spacing:-0.01em}
.hide{display:none!important}

/* ---------- 공통 ---------- */
.btn{height:52px;border-radius:14px;font-size:16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.15s;padding:0 20px}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-d)}
.btn-primary:disabled{background:#D1D6DB;color:#fff;cursor:not-allowed;transform:none}
.btn-ghost{background:#F2F4F6;color:var(--sub);font-weight:600}
.btn-ghost:hover{background:#E8EBED}
.btn-sm{height:38px;border-radius:10px;font-size:14px;padding:0 14px}
.btn-danger{background:var(--red-l);color:var(--red)}
.card{background:var(--card);border-radius:var(--r);padding:20px}
.muted{color:var(--dim)}
.mono-num{font-variant-numeric:tabular-nums}

/* ---------- 헬프 버튼 ---------- */
.help{width:22px;height:22px;border-radius:50%;background:#E5E8EB;color:var(--sub);
  font-size:13px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex:none}
.help:hover{background:var(--blue-l);color:var(--blue)}

/* ---------- 모달 ---------- */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}
.modal{background:#fff;border-radius:20px;padding:26px;max-width:440px;width:100%;max-height:82vh;overflow:auto}
.modal h3{margin:0 0 14px;font-size:19px;font-weight:800}
.modal .step{display:flex;gap:12px;margin-bottom:14px}
.modal .num{width:24px;height:24px;border-radius:50%;background:var(--blue-l);color:var(--blue);
  font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.modal p{margin:0;font-size:15px;color:var(--sub);line-height:1.55}
.modal p b{color:var(--ink);font-weight:700}

/* ---------- 로그인 ---------- */
#login{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#login h1{font-size:27px;font-weight:800;margin:0 0 10px;letter-spacing:-0.03em}
#login p{color:var(--dim);margin:0 0 40px;font-size:16px}
.gbtn{width:100%;max-width:340px;height:56px;border-radius:16px;background:#fff;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px;font-weight:700}
.gbtn:hover{background:#FAFBFC}
.gbtn svg{width:19px;height:19px}

/* ---------- 상단바 ---------- */
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hin{max-width:1240px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px}
.htitle{font-size:16px;font-weight:800;letter-spacing:-0.02em}
.spacer{flex:1}
.badge{padding:6px 12px;border-radius:99px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.on{background:var(--green-l);color:var(--green)}
.badge.off{background:#F2F4F6;color:var(--dim)}
.who{font-size:13px;color:var(--dim);max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:4px;background:#F2F4F6;padding:3px;border-radius:11px}
.tabs button{padding:7px 15px;border-radius:8px;font-size:14px;font-weight:700;color:var(--dim)}
.tabs button.sel{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.07)}

/* ---------- 학생 ---------- */
main{max-width:1240px;margin:0 auto;padding:20px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.panel{background:#fff;border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.ph{padding:16px 20px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--line)}
.ph h2{margin:0;font-size:16px;font-weight:800}
.pb{padding:20px;flex:1;min-height:0}

#editor{width:100%;min-height:460px;border:none;outline:none;resize:vertical;font-size:15.5px;line-height:1.85;color:var(--ink);background:transparent}
#editor::placeholder{color:#C4CBD3}
.meta{padding:12px 20px;border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;font-size:13px;color:var(--dim)}
.meta b{color:var(--sub);font-weight:700}
.overlimit{color:var(--red)!important}

#fbBody{white-space:pre-wrap;font-size:15px;line-height:1.8;min-height:460px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:460px;text-align:center;color:#C4CBD3;gap:10px}
.empty .big{font-size:30px}
.empty p{margin:0;font-size:15px;font-weight:600;color:var(--dim)}

.scorebar{display:flex;align-items:baseline;gap:8px;padding:16px 20px;background:var(--blue-l);border-radius:12px;margin-bottom:16px}
.scorebar .n{font-size:30px;font-weight:800;color:var(--blue);line-height:1}
.scorebar .t{font-size:14px;font-weight:700;color:var(--blue)}

.bar{position:sticky;bottom:0;margin-top:16px;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);
  border-radius:var(--r);padding:14px 20px;display:flex;align-items:center;gap:14px;box-shadow:0 -2px 16px rgba(0,0,0,.05)}
.left-note{font-size:14px;color:var(--sub);font-weight:600}
.left-note b{color:var(--blue);font-weight:800}
.tools{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- 교사 ---------- */
.trow{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.switch{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:12px 18px}
.sw{width:54px;height:31px;border-radius:99px;background:#D1D6DB;position:relative;transition:.2s;flex:none}
.sw.on{background:var(--green)}
.sw i{position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on i{left:26px}
.swlabel{font-size:15px;font-weight:700}
.swsub{font-size:13px;color:var(--dim);font-weight:500}

.slist{display:flex;flex-direction:column;gap:12px}
.scard{background:#fff;border-radius:var(--r);padding:18px 20px}
.scard.none{background:#F7F8F9;opacity:.85}
.sh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.hak{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.mail{font-size:13px;color:var(--dim)}
.tag{padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700}
.tag.wait{background:#EDF0F2;color:var(--gray)}
.tag.done{background:var(--green-l);color:var(--green)}
.tag.ung{background:#FFF4E5;color:#D97706}
.cell{margin-top:14px}
.cell .lab{font-size:12px;font-weight:800;color:var(--dim);letter-spacing:.02em;margin-bottom:6px}
.cell .val{white-space:pre-wrap;font-size:14.5px;line-height:1.75;background:#F9FAFB;border-radius:10px;padding:12px 14px}
.scoreedit{display:flex;align-items:center;gap:8px}
.scoreedit input{width:78px;height:44px;border:1px solid var(--line);border-radius:10px;text-align:center;
  font-size:20px;font-weight:800;font-family:inherit;font-variant-numeric:tabular-nums;color:var(--ink)}
.scoreedit input:focus{outline:2px solid var(--blue);border-color:transparent}
.scoreedit .of{font-size:14px;color:var(--dim);font-weight:600}
.edited{font-size:12px;font-weight:700;color:#D97706}

.ta{width:100%;min-height:120px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14.5px;line-height:1.7;resize:vertical;outline:none}
.ta:focus{border-color:var(--blue)}

/* ---------- 토스트 ---------- */
#toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
  background:rgba(25,31,40,.94);color:#fff;padding:13px 20px;border-radius:12px;font-size:14.5px;font-weight:600;transition:.22s;z-index:200;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- 로딩 ---------- */
.spin{width:17px;height:17px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
.spin.dark{border-color:rgba(25,31,40,.2);border-top-color:var(--ink)}
@keyframes sp{to{transform:rotate(360deg)}}

@media (max-width:900px){
  .split{grid-template-columns:1fr}
  #fbBody,.empty{min-height:220px}
  #editor{min-height:320px}
  .hin{padding:10px 14px;gap:8px}
  .htitle{font-size:15px}
  .who{display:none}
  main{padding:14px}
  .bar{flex-direction:column;align-items:stretch}
  .bar .btn{width:100%}
}
</style>
</head>
<body>

<!-- ===================== 로그인 ===================== -->
<div id="login">
  <h1 id="loginTitle">발표 대본 제출</h1>
  <p>학교 구글 계정으로 로그인해 주세요</p>
  <button class="gbtn" id="btnLogin">
    <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.6 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6.1C12.3 13.2 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.2 5.6c4.2-3.9 6.6-9.6 6.6-17z"/><path fill="#FBBC05" d="M10.4 28.7c-.5-1.4-.8-2.9-.8-4.7s.3-3.3.8-4.7l-7.8-6.1C1 16.3 0 20 0 24s1 7.7 2.6 10.8l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.2-5.6c-2 1.4-4.6 2.2-8.7 2.2-6.3 0-11.7-3.7-13.6-9.1l-7.8 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
    구글로 시작하기
  </button>
  <p id="loginErr" class="hide" style="color:var(--red);margin-top:22px;font-size:14px;font-weight:600"></p>
</div>

<!-- ===================== 앱 ===================== -->
<div id="app" class="hide">
  <header>
    <div class="hin">
      <span class="htitle" id="appTitle">발표 대본</span>
      <span class="badge off" id="openBadge"><span class="dot"></span><span id="openText">닫힘</span></span>
      <span class="spacer"></span>
      <div class="tabs hide" id="tabs">
        <button id="tabS" class="sel">학생</button>
        <button id="tabT">교사</button>
      </div>
      <span class="who" id="who"></span>
      <button class="btn btn-ghost btn-sm" id="btnLogout">로그아웃</button>
    </div>
  </header>

  <!-- ---------- 학생 ---------- -->
  <main id="viewStudent">
    <div class="split">
      <!-- 피드백 -->
      <section class="panel">
        <div class="ph">
          <h2>피드백</h2>
          <button class="help" data-help="feedback">?</button>
          <span class="spacer"></span>
          <div class="tools">
            <button class="btn btn-ghost btn-sm" id="btnCopyFb">복사</button>
            <button class="btn btn-ghost btn-sm" id="btnJpgFb">JPG</button>
          </div>
        </div>
        <div class="pb">
          <div id="fbEmpty" class="empty">
            <div class="big">📝</div>
            <p>글을 제출하면<br>여기에 피드백이 나와요</p>
          </div>
          <div id="fbWrap" class="hide">
            <div class="scorebar"><span class="n" id="fbScore">–</span><span class="t">/ 40점</span></div>
            <div id="fbBody"></div>
          </div>
        </div>
      </section>

      <!-- 내 글 -->
      <section class="panel">
        <div class="ph">
          <h2>내 글</h2>
          <button class="help" data-help="write">?</button>
          <span class="spacer"></span>
          <div class="tools">
            <button class="btn btn-ghost btn-sm" id="btnCopyMine">복사</button>
            <button class="btn btn-ghost btn-sm" id="btnJpgMine">JPG</button>
            <button class="btn btn-ghost btn-sm" id="btnPdfMine">PDF</button>
          </div>
        </div>
        <div class="pb" style="padding-bottom:0">
          <textarea id="editor" spellcheck="false" placeholder="여기에 발표 대본을 쓰세요.

안녕하세요. 저는 '…'를 통해 …"></textarea>
        </div>
        <div class="meta">
          <span><b id="cntSent">0</b>문장</span>
          <span><b id="cntChar">0</b>자</span>
          <span class="spacer"></span>
          <span id="saveState">·</span>
        </div>
      </section>
    </div>

    <div class="bar">
      <span class="left-note" id="subNote">남은 제출 <b>3</b>회</span>
      <button class="help" data-help="submit">?</button>
      <span class="spacer"></span>
      <button class="btn btn-primary" id="btnSubmit" style="min-width:190px">제출하기</button>
    </div>
  </main>

  <!-- ---------- 교사 ---------- -->
  <main id="viewTeacher" class="hide">
    <div class="trow">
      <div class="switch">
        <div class="sw" id="swOpen"><i></i></div>
        <div>
          <div class="swlabel" id="swLabel">제출 닫힘</div>
          <div class="swsub" id="swSub">학생이 제출할 수 없어요</div>
        </div>
        <button class="help" data-help="open">?</button>
      </div>
      <span class="spacer"></span>
      <button class="btn btn-ghost btn-sm" id="btnRoster">명렬표</button>
      <button class="btn btn-ghost btn-sm" id="btnAddTeacher">교사 계정 추가</button>
      <button class="btn btn-ghost btn-sm" id="btnReset">횟수 초기화</button>
      <button class="btn btn-ghost btn-sm" id="btnGradeAll">전체 채점</button>
      <button class="btn btn-primary btn-sm" id="btnXlsx">엑셀 다운로드</button>
      <button class="help" data-help="teacher">?</button>
    </div>
    <div class="slist" id="slist"></div>
  </main>
</div>

<div id="toast"></div>

<script src="env.js"></script>
<script src="config.js"></script>
<script src="prompts.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, onSnapshot, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ================== 초기화 ================== */
const app  = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(app);
const db   = getFirestore(app);
const provider = new GoogleAuthProvider();
if (ALLOWED_DOMAIN) provider.setCustomParameters({ hd: ALLOWED_DOMAIN });

const $ = s => document.querySelector(s);
const settingsRef = doc(db, "settings", "global");

let me = null;           // {uid,email,hakbeon}
let isTeacher = false;
let settings = { isOpen:false, teachers:[OWNER_EMAIL], roster:[] };
let myDoc = { draft:"", submittedText:"", submitCount:0, feedback:"" };
let students = [];
let unsubStudents = null, unsubMine = null, unsubSettings = null;

document.title = TASK_TITLE;
$("#loginTitle").textContent = TASK_TITLE;
$("#appTitle").textContent = TASK_TITLE;

/* ================== 유틸 ================== */
function toast(msg, ms=2400){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove("show"), ms);
}
function hakbeonOf(email){
  const local = (email||"").split("@")[0];
  const m = local.match(new RegExp(HAKBEON_PATTERN));
  return m ? m[0] : "";
}
/* 채점 구간(절취선 위)만 잘라낸다 */
function gradedPart(text){
  const t = text || "";
  const cut = t.search(/-{3,}[^\n]*여기까지만[^\n]*|^\s*\(?\s*질문\s*\)?\s*$/m);
  return cut > 0 ? t.slice(0, cut) : t;
}
function countSentences(text){
  const body = gradedPart(text).replace(/\([^)]*\)/g,' ').replace(/\s+/g,' ').trim();
  if (!body) return 0;
  return body.split(/(?<=[.!?])\s+/).filter(s=>s.trim().length>1).length;
}
function countChars(text){ return gradedPart(text).replace(/\s+/g,' ').trim().length; }

async function askGemini(systemPrompt, studentText){
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_API_KEY}`;
  const res = await fetch(url, {
    method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      systemInstruction:{ parts:[{ text: systemPrompt }] },
      contents:[{ role:"user", parts:[{ text: "다음은 학생이 쓴 발표 대본이다.\n\n" + studentText }] }],
      generationConfig:{ temperature:0.4, maxOutputTokens:4096 }
    })
  });
  if (!res.ok){
    const e = await res.text();
    throw new Error(res.status === 429 ? "잠시 뒤에 다시 시도해 주세요 (요청이 몰렸어요)" : "채점 실패: " + e.slice(0,180));
  }
  const j = await res.json();
  const out = j?.candidates?.[0]?.content?.parts?.map(p=>p.text).join("") || "";
  if (!out) throw new Error("응답이 비어 있어요. 다시 시도해 주세요.");
  return out.trim();
}
function parseScore(text){
  const m = text.match(/(?:예상\s*점수|최종점수)\s*[:：]\s*(\d{1,2})\s*점/);
  return m ? parseInt(m[1],10) : null;
}
function splitGrade(raw){
  const i = raw.indexOf("###SCORE###");
  if (i < 0) return { body: raw, total: parseScore(raw) };
  const body = raw.slice(0,i).trim();
  let total = parseScore(body);
  try { total = JSON.parse(raw.slice(i+11).trim()).total ?? total; } catch(e){}
  return { body, total };
}
async function shot(node){
  return html2canvas(node, { backgroundColor:"#ffffff", scale:2, useCORS:true });
}
function download(dataUrl, name){
  const a = document.createElement("a"); a.href = dataUrl; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}
async function copyText(text, what){
  try { await navigator.clipboard.writeText(text); toast(what + " 복사했어요"); }
  catch(e){ toast("복사에 실패했어요"); }
}

/* ================== 도움말 ================== */
const HELP = {
  write:["내 글 쓰는 곳", [
    "여기에 발표 대본을 씁니다. 쓰는 동안 자동으로 저장돼서, 나중에 다시 들어와도 이어서 쓸 수 있어요.",
    "아래 문장 수와 글자 수를 보세요. <b>26문장 · 1,300자</b>를 넘으면 발표가 3분을 넘깁니다.",
    "피드백을 받은 뒤에는 이 칸에서 바로 고쳐서 다시 제출하면 됩니다."
  ]],
  feedback:["피드백 보는 곳", [
    "제출하면 왼쪽에 예상 점수와 피드백이 나옵니다.",
    "피드백을 보면서 <b>오른쪽 내 글</b>을 고치세요.",

function openHelp(key){
  const [title, steps] = HELP[key];
  const mask = document.createElement("div"); mask.className = "mask";
  mask.innerHTML = `<div class="modal">
    <h3>${title}</h3>
    ${steps.map((s,i)=>`<div class="step"><div class="num">${i+1}</div><p>${s}</p></div>`).join("")}
    <button class="btn btn-primary" style="width:100%;margin-top:8px">알겠어요</button>
  </div>`;
  mask.addEventListener("click", e => { if (e.target===mask || e.target.tagName==="BUTTON") mask.remove(); });
  document.body.appendChild(mask);
}
document.addEventListener("click", e => {
  const h = e.target.closest("[data-help]");
  if (h) openHelp(h.dataset.help);
});
function confirmBox(title, body, okText){
  return new Promise(resolve => {
    const mask = document.createElement("div"); mask.className = "mask";
    mask.innerHTML = `<div class="modal">
      <h3>${title}</h3><p style="margin-bottom:22px">${body}</p>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost" style="flex:1" data-no>취소</button>
        <button class="btn btn-primary" style="flex:1.4" data-yes>${okText}</button>
      </div></div>`;
    mask.addEventListener("click", e => {
      if (e.target.hasAttribute("data-yes")) { mask.remove(); resolve(true); }
      else if (e.target.hasAttribute("data-no") || e.target===mask) { mask.remove(); resolve(false); }
    });
    document.body.appendChild(mask);
  });
}
function promptBox(title, hint, value=""){
  return new Promise(resolve => {
    const mask = document.createElement("div"); mask.className = "mask";
    mask.innerHTML = `<div class="modal">
      <h3>${title}</h3><p style="margin-bottom:12px">${hint}</p>
      <textarea class="ta" id="_pv"></textarea>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button class="btn btn-ghost" style="flex:1" data-no>취소</button>
        <button class="btn btn-primary" style="flex:1.4" data-yes>저장</button>
      </div></div>`;
    document.body.appendChild(mask);
    const ta = mask.querySelector("#_pv"); ta.value = value; ta.focus();
    mask.addEventListener("click", e => {
      if (e.target.hasAttribute("data-yes")) { const v = ta.value; mask.remove(); resolve(v); }
      else if (e.target.hasAttribute("data-no") || e.target===mask) { mask.remove(); resolve(null); }
    });
  });
}

onAuthStateChanged(auth, async user => {
  [unsubStudents, unsubMine, unsubSettings].forEach(f => f && f());
  unsubStudents = unsubMine = unsubSettings = null;

  if (!user){ $("#login").classList.remove("hide"); $("#app").classList.add("hide"); me=null; return; }

  const email = (user.email||"").toLowerCase();
  if (ALLOWED_DOMAIN && !email.endsWith("@"+ALLOWED_DOMAIN.toLowerCase()) && email !== OWNER_EMAIL.toLowerCase()){
    await signOut(auth);
    $("#loginErr").textContent = `학교 계정(@${ALLOWED_DOMAIN})으로 로그인해 주세요.`;
    $("#loginErr").classList.remove("hide");
    return;
  }

  me = { uid:user.uid, email, hakbeon: hakbeonOf(email) };
  $("#who").textContent = email;
  $("#login").classList.add("hide"); $("#app").classList.remove("hide");

  unsubSettings = onSnapshot(settingsRef, async snap => {
    if (!snap.exists()){
      if (email === OWNER_EMAIL.toLowerCase()){
        await setDoc(settingsRef, { isOpen:false, teachers:[OWNER_EMAIL.toLowerCase()], roster:[], maxSubmissions:MAX_SUBMISSIONS });
      }
      return;
    }
    settings = { isOpen:false, teachers:[], roster:[], ...snap.data() };
    const wasTeacher = isTeacher;
    isTeacher = settings.teachers.map(t=>t.toLowerCase()).includes(email) || email === OWNER_EMAIL.toLowerCase();
    $("#tabs").classList.toggle("hide", !isTeacher);
    if (isTeacher && !wasTeacher) watchStudents();
    paintOpen(); paintSubmitState(); renderStudents();
  });

  const mineRef = doc(db, "students", me.uid);
  const snap = await getDoc(mineRef);
  if (!snap.exists()){
    await setDoc(mineRef, { email, hakbeon:me.hakbeon, draft:"", submittedText:"", submitCount:0, feedback:"", updatedAt:serverTimestamp() });
  }
  unsubMine = onSnapshot(mineRef, s => {
    if (!s.exists()) return;
    const d = s.data();
    myDoc = { draft:"", submittedText:"", submitCount:0, feedback:"", ...d };
    if (document.activeElement !== $("#editor")) $("#editor").value = myDoc.draft || "";
    updateCounts(); paintFeedback(); paintSubmitState();
  });
});

function paintOpen(){
  const on = !!settings.isOpen;
  $("#openBadge").className = "badge " + (on ? "on" : "off");
  $("#openText").textContent = on ? "제출 열림" : "제출 닫힘";

  $("#swSub").textContent = on ? "학생이 제출할 수 있어요" : "학생이 제출할 수 없어요";
}
function paintSubmitState(){
  const max = settings.maxSubmissions || MAX_SUBMISSIONS;
  const left = Math.max(0, max - (myDoc.submitCount||0));
  const btn = $("#btnSubmit"), note = $("#subNote");
  if (!settings.isOpen){
    btn.disabled = true; btn.textContent = "지금은 제출할 수 없어요";
    note.innerHTML = `남은 제출 <b>${left}</b>회 · 글쓰기와 저장은 계속할 수 있어요`;
  } else if (left <= 0){
    btn.disabled = true; btn.textContent = "제출 완료";
    note.innerHTML = `<b>3회</b> 모두 제출했어요 · 복사와 저장은 계속할 수 있어요`;
  } else {
    btn.disabled = false; btn.textContent = left===1 ? "마지막 제출하기" : "제출하기";
    note.innerHTML = `남은 제출 <b>${left}</b>회`;
  }
}

  $("#fbEmpty").classList.toggle("hide", has);

$("#btnSubmit").onclick = async () => {
  const text = $("#editor").value.trim();
  if (text.length < 50){ toast("대본을 좀 더 쓴 뒤에 제출해 주세요"); return; }
  const max = settings.maxSubmissions || MAX_SUBMISSIONS;
  const used = myDoc.submitCount || 0;
  if (!settings.isOpen || used >= max) return;

  if (used === max - 1){
    const ok = await confirmBox(
      "마지막 제출이에요",
      "지금 제출하면 더이상 제출할 수 없습니다. 정말로 제출하시겠습니까?",
      "제출할게요");
    if (!ok) return;
  }

  const btn = $("#btnSubmit");
  btn.disabled = true; btn.innerHTML = `<span class="spin"></span> 채점 중…`;
  try{
    const fb = await askGemini(STUDENT_PROMPT, text);
    await updateDoc(doc(db,"students",me.uid), {
      draft:text, submittedText:text, feedback:fb,
      submitCount: used + 1, submittedAt: serverTimestamp(), updatedAt: serverTimestamp()
    });
    toast(`${used+1}번째 제출 완료 · 남은 제출 ${max-used-1}회`, 3200);
    window.scrollTo({ top:0, behavior:"smooth" });
  } catch(e){
    toast(e.message || "제출에 실패했어요", 4000);
  } finally {
    paintSubmitState();
  }
};

$("#btnPdfMine").onclick = async () => {
  if (!$("#editor").value.trim()){ toast("쓴 글이 없어요"); return; }
  toast("PDF를 만들고 있어요");
  const c = await mineCanvas();
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF("p","mm","a4");
  const W = 210, H = 297;
  const imgH = c.height * W / c.width;         // mm 로 환산한 전체 높이
  const pages = Math.max(1, Math.ceil(imgH / H));
  const img = c.toDataURL("image/jpeg",0.95);
  for (let i = 0; i < pages; i++){
    if (i) pdf.addPage();
    pdf.addImage(img, "JPEG", 0, -i * H, W, imgH);
  }
  pdf.save(`발표대본_${me.hakbeon||"내글"}.pdf`);
};

function rows(){
  const byHak = new Map();
  students.filter(s => s.submittedText).forEach(s => {
    const h = s.hakbeon || hakbeonOf(s.email) || "";
    byHak.set(h || s.email, { ...s, hakbeon:h });
  });
  (settings.roster||[]).forEach(h => { if (!byHak.has(h)) byHak.set(h, { hakbeon:h, missing:true }); });
  return [...byHak.values()].sort((a,b) =>
    String(a.hakbeon||"zzz").localeCompare(String(b.hakbeon||"zzz"), "ko", { numeric:true }));
}
function renderStudents(){
  if (!isTeacher) return;
  const list = rows();
  $("#slist").innerHTML = list.map(s => {
    if (s.missing) return `<div class="scard none"><div class="sh">
      <span class="hak" style="color:var(--gray)">${s.hakbeon}</span>
      <span class="tag wait">미제출</span></div></div>`;
    const g = s.grade || {};
    const shown = (g.editedTotal ?? g.total);
    return `<div class="scard" data-id="${s.id}">
      <div class="sh">
        <span class="hak">${s.hakbeon || "–"}</span>
        <span class="mail">${s.email||""}</span>
        <span class="tag done">${s.submitCount||0}회 제출</span>
        ${g.body ? "" : `<span class="tag ung">채점 전</span>`}
        <span class="spacer"></span>
        <button class="btn btn-ghost btn-sm" data-act="grade">${g.body ? "다시 채점" : "채점"}</button>
        <button class="btn btn-ghost btn-sm" data-act="copy">복사</button>
        <button class="btn btn-ghost btn-sm" data-act="jpg">JPG</button>
      </div>
      ${g.body ? `
      <div class="cell"><div class="lab">최종점수</div>
        <div class="scoreedit">
          <input type="number" min="0" max="40" value="${shown ?? ""}" data-act="score">
          <span class="of">/ 40점</span>
          ${g.editedTotal!=null && g.editedTotal!==g.total ? `<span class="edited">수정함 (원래 ${g.total}점)</span>` : ""}
        </div>
      </div>
      <div class="cell"><div class="lab">감점된 이유</div><div class="val">${esc(g.reasons||"")}</div></div>
      ${g.gwasetuk ? `<div class="cell"><div class="lab">과목세부능력특기사항</div><div class="val">${esc(g.gwasetuk)}</div></div>` : ""}
      ` : `<div class="cell"><div class="val muted">아직 채점하지 않았어요</div></div>`}
    </div>`;
  }).join("") || `<div class="card muted">아직 제출한 학생이 없어요</div>`;
}
function esc(s){ return String(s).replace(/[&<>]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c])); }

/* 감점 이유 / 과세특 분리 */
function splitSections(body){
  const reasons = (body.match(/2\.\s*감점된\s*이유([\s\S]*?)(?=\n\s*3\.\s|$)/) || [,""])[1].trim();
  const gws = (body.match(/3\.\s*과목세부능력특기사항([\s\S]*)$/) || [,""])[1].trim();
  return { reasons, gwasetuk: gws };
}
$("#slist").addEventListener("click", async e => {
  const btn = e.target.closest("[data-act]"); if (!btn) return;
  const card = e.target.closest(".scard"); const id = card?.dataset.id; if (!id) return;
  const s = students.find(x => x.id === id); if (!s) return;
  const act = btn.dataset.act;

  if (act === "grade"){
    btn.disabled = true; btn.innerHTML = `<span class="spin dark"></span>`;
    try{
      const raw = await askGemini(TEACHER_PROMPT, s.submittedText);
      const { body, total } = splitGrade(raw);
      const { reasons, gwasetuk } = splitSections(body);
      await updateDoc(doc(db,"students",id), { grade:{ body, total, reasons, gwasetuk, editedTotal:null, gradedAt:Date.now() } });
      toast(`${s.hakbeon||""} 채점 완료`);
    } catch(err){ toast(err.message, 4000); btn.disabled = false; btn.textContent = "채점"; }
  }
  if (act === "copy"){
    copyText(s.grade?.body || "", "채점 결과를");
  }
  if (act === "jpg"){
    toast("이미지를 만들고 있어요");
    const c = await shot(card);
    download(c.toDataURL("image/jpeg",0.95), `채점_${s.hakbeon||id}.jpg`);

});

  const ok = await confirmBox("전체 채점", `채점하지 않은 <b>${targets.length}명</b>을 채점합니다. 시간이 조금 걸려요.`, "채점 시작");
  if (!ok) return;
  const btn = $("#btnGradeAll"); btn.disabled = true;
  let done = 0;
  for (const s of targets){
    btn.innerHTML = `<span class="spin dark"></span> ${++done}/${targets.length}`;
    try{
      const raw = await askGemini(TEACHER_PROMPT, s.submittedText);
      const { body, total } = splitGrade(raw);
      const { reasons, gwasetuk } = splitSections(body);
      await updateDoc(doc(db,"students",s.id), { grade:{ body, total, reasons, gwasetuk, editedTotal:null, gradedAt:Date.now() } });
    } catch(err){ /* 한 명 실패해도 계속 */ }
    await new Promise(r => setTimeout(r, 1500));   // 무료 등급 분당 제한 대비
  }
  btn.disabled = false; btn.textContent = "전체 채점";
  toast("전체 채점을 마쳤어요");
};

$("#btnXlsx").onclick = () => {
  const data = rows().map(s => {
    const g = s.grade || {};
    return {
      "학번": s.hakbeon || "",
      "구글 아이디": s.email || "",
      "제출": s.missing ? "미제출" : `${s.submitCount||0}회`,
      "최종점수": s.missing ? "" : (g.editedTotal ?? g.total ?? ""),
      "감점된 이유": g.reasons || "",
      "과목세부능력특기사항": g.gwasetuk || "",
      "제출한 글": s.submittedText || ""
    };
  });
  const ws = XLSX.utils.json_to_sheet(data);
  ws["!cols"] = [{wch:9},{wch:30},{wch:8},{wch:10},{wch:60},{wch:60},{wch:80}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "채점결과");
  const d = new Date();
  const stamp = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
  XLSX.writeFile(wb, `발표대본_채점_${stamp}.xlsx`);
  toast("엑셀 파일을 저장했어요");
};
</script>
</body>
</html>
